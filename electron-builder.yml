appId: com.plantuml.interactive-editor
productName: PlantUML Interactive Editor
copyright: Copyright © 2026

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - dist-electron/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PlantUML Interactive Editor
  runAfterFinish: true

extraResources:
  - from: src/python-backend/dist/
    to: python-backend/
    filter:
      - "**/*"

publish: null
